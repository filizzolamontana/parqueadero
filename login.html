<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Parqueadero - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-left">
            <img src="img/login-banner.png" alt="Ilustración Parqueadero" class="login-image">
        </div>

        <div class="login-right">
            <div class="login-content">

                <div class="login-header">
                    <div class="logo-wrapper">
                        <img src="img/logo.png" alt="Logo Parqueadero" class="system-logo">
                    </div>
                    <h1>SISTEMA DE GESTIÓN<br>DE PARQUEADERO</h1>
                    <div class="blue-line"></div>
                    <p class="subtitle">Inicia sesión para continuar</p>
                </div>

                <form class="login-form" onsubmit="event.preventDefault(); location.href='index.html'">

                    <div class="input-group">
                        <label for="usuario">Usuario</label>
                        <div class="input-wrapper">
                            <span class="material-icons-outlined input-icon">person</span>
                            <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <span class="material-icons-outlined input-icon">lock</span>
                            <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                            <span class="material-icons-outlined toggle-password">visibility</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-ingresar">
                        <span class="material-icons-outlined">arrow_forward</span>
                        INGRESAR
                    </button>

                    <a href="#" class="forgot-password">
                        <span class="material-icons-outlined lock-small">lock</span> ¿Olvidaste tu contraseña?
                    </a>
                </form>

                <div class="security-notice">
                    <span class="material-icons-outlined shield-icon">verified_user</span>
                    <div class="security-text">
                        <p class="security-title">Tu seguridad es nuestra prioridad</p>
                        <p class="security-desc">Acceso restringido solo para personal autorizado.</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>

</html>
